changes:
  - add: "Были добавлены новые казино-машины Crash и Wheel of Fortune с механиками ставок и выигрышей. (PR #224)"
  - admin: "Интерфейс защищенного кейса переработан, переименован в LockedSafe с добавлением проверки кода и русской локализацией. (PR #224)"
  - qol: "Механика смешивания коктейлей изменена: теперь для получения результата требуется взбалтывать содержимое шейкера. (PR #224)"
  - bugfix: "Логика радио-джаммеров исправлена: проверка радиуса теперь осуществляется через вызов функции вместо перебора. (PR #224)"
  - sound: "Был добавлен звуковой эффект can_shake.ogg для шейкера при взбалтывании. (PR #224)"
  - tgs: "Созданы новые TGUI-интерфейсы для казино и защищенного кейса: CasinoCrash, CasinoWheel и LockedSafe. (PR #224)"