author: "KINGDICE666"
delete-after: True
changes:
  - bugfix: "Исправлена отрисовка персонажей, сидящих на мотоцикле, скутере охраны и машине. (PR #223)"
  - bugfix: "Исправлена выдача наград за щупальца некрополя: очки теперь начисляются за каждое щупальце, а достижение выдаётся только за последнее. (PR #223)"
  - bugfix: "Колосс больше не стреляет дважды за одну атаку. (PR #223)"
  - bugfix: "Исправлено поведение шахтёрского дрона: он корректно переключается в режим сбора и не отключается в нём. (PR #223)"
  - bugfix: "Предметы, подхваченные захватом дрона, больше не отображаются с чужим слоем и плоскостью. (PR #223)"
  - bugfix: "Исправлена синхронизация аксессуара хвоста с телом владельца. (PR #223)"
  - bugfix: "Поглощение пищи теперь не срабатывает, если рот занят. (PR #223)"
  - sound: "Увеличены громкость и дальность звука термоэлектрического генератора. (PR #223)"
  - tweak: "Дезматч снова доступен для запуска через терминал мини-игр. (PR #223)"
  - local: "Добавлено условие получения в описание достижения «Уничтожитель Щупалец». (PR #223)"
  - tgs: "Исправлена сборка под TGS. (PR #223)"