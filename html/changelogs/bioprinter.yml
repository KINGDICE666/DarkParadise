author: "KINGDICE666"
delete-after: true
changes:
  - qol: "Биопринтер показывает только расы из обычного выбора персонажа и миниатюры расовых органов. Убрана лишняя цифра 0 в интерфейсе."
  - rscadd: "В медицинском разделе карго доступен биопринтер органов. Плату также можно изготовить в R&D. Сырое мясо перерабатывается в биомассу для печати расовых органов, кроме мозга и имплантов."
  - balance: "Биопечатные органы имеют половину обычной прочности и не принимаются по заказам карго. Органические копии три минуты приживаются после пересадки: расходуют питание пациента и повреждаются при голодании."
  - bugfix: "Напечатанные органы портятся вне холодильника, а копии органов дионы больше не превращаются в нимф. Биопринтер можно обслужить при прерванной печати: открыть панель отвёрткой, починить сваркой или разобрать ломом. Стоимость печати сердца — 30 биомассы."
