author: "KINGDICE666"
delete-after: True
changes:
  - add: "Добавлена система наклеек: можно наклеивать наклейки на предметы и мобов, есть десятки вариантов дизайнов, коробки с наклейками в закупках и синдикатский набор в аплинке. (PR #232)"
  - tweak: "Полностью переработаны банки с газировкой: теперь они имеют механику газированности (встряхивание ПКМ увеличивает давление, может привести к взрыву), открываются кликом, можно сокрушить лбом или пулей, добавлены звуки открытия. (PR #232)"
  - add: "Добавлены 9 новых напитков: Рисовое пиво, Sol Dry, Pwr Game, Сок Шамблера, Веллчирс, Грей Булл, Манки Энерджи, 24-Вольт Энерджи, Дынная газировка — у каждого уникальные эффекты. (PR #232)"
  - expansion: "Кибернетические уши расширены до 11 вариантов: базовые, улучшенные, чувствительные к шепоту, с регулировкой громкости, рентгеновские (слышат сквозь стены) — и кошачьи версии каждого. (PR #232)"
  - add: "Добавлена черта \"Рентгеновский слух\" (TRAIT_XRAY_HEARING) — позволяет слышать речь сквозь стены, даётся рентгеновскими кибернетическими ушами. (PR #232)"
  - refactor: "Система урона ушам переработана: вместо прямого вызова internal_receive_damage используется единый proc sound_damage(), уши имеют множитель урона и защиту от громких звуков (bang_protect). (PR #232)"
  - code_imp: "Атмосферная подсистема получила новую фазу обработки атомов (SSAIR_ATOMS), сигнал COMSIG_TURF_EXPOSE и элемент atmos_sensitive для предметов, реагирующих на атмосферу. (PR #232)"
  - qol: "Monkey Energy даёт буст скорости обезьянам. Флешбанги и шахтные заряды используют новую систему урона ушам. В инженерный шкаф добавлена наклейка \"Одобрено СИ\", в ClothesMate — коробка с печатями чистоты. (PR #232)"