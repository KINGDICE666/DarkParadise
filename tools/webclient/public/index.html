<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dark Paradise в браузере</title>
<style>
html,body{margin:0;height:100%;background:#0d0f14;color:#e6e8ee;font:14px/1.4 system-ui,sans-serif}
body{display:flex;flex-direction:column}
header{display:flex;gap:12px;align-items:center;padding:6px 16px}
header b{font-size:16px}
#status{opacity:.7}
iframe{flex:1;width:100%;border:0;background:#000}
</style></head>
<body>
<header><b>Dark Paradise</b><span id="status">Проверяю сервер…</span></header>
<iframe id="game" allow="fullscreen; autoplay; clipboard-read; clipboard-write" allowfullscreen></iframe>
<script>
const status = document.getElementById('status');
fetch('/query').then((r) => r.json()).then((q) => {
  status.textContent = q.fail ? q.fail : 'BYOND ' + q.version;
}).catch(() => {
  status.textContent = 'Сервер недоступен';
});
document.getElementById('game').src = 'http://www.byond.com/play/embed/' + location.host;
</script>
</body></html>
