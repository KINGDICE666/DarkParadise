author: "KINGDICE666"
delete-after: True
changes:
  - add: "Добавлен активный сонар‑пинг для эффекта прислушивания резоми, показывающий слышимые существа и предметы каждые полсекунды. (PR #158)"
  - tweak: "Обновлено описание вида резоми: растительная пища теперь отмечена как ядовита, а резоми не принимают киберимпланты и протезы. (PR #158)"
  - tweak: "Изменено действие клика для разбивания стеклянных бутылок: теперь используется левый клик вместо правого при нанесении вреда живому существу. (PR #158)"
  - add: "Добавлено автоматическое бросание слишком тяжёлого предмета и показ баллонного предупреждения «слишком тяжело!» при попытке удерживать его. (PR #158)"
  - add: "Добавлена возможность извлечения содержимого из контейнеров хранения в сумку‑модконтроллер, если контейнер не помечен как хранящийся. (PR #158)"
  - qol: "Сделано автоматическое обновление спрайтов нижнего и верхнего белья при добавлении или удалении рук хирургией. (PR #158)"