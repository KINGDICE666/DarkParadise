author: "KINGDICE666"
delete-after: True
changes:
  - add: "Добавлены порталы в билдмоде: можно создавать, связывать, закрывать и менять цвет порталов через интерфейс линковки. (PR #195)"
  - add: "Добавлена функция дрожания (jitter) параметров фильтров в админ-панели Filterrific. (PR #195)"
  - bugfix: "Исправлена анимация снарядов со скоростью выше тика сервера. (PR #195)"
  - qol: "Ввод биндов теперь корректно работает с разными клавиатурными раскладками. (PR #195)"
  - balance: "Черты TRAIT_I_WANT_BRAINS теперь даёт иммунитет к сердечному приступу. (PR #195)"
  - qol: "Предметы с флагом ABSTRACT больше не блокируют слоты из-за громоздкости. (PR #195)"
  - bugfix: "Венты и скрабберы обновляют название при перемещении между зонами. (PR #195)"
  - bugfix: "Исправлен кулдаун и проверка доступа в консоли робоквестов. (PR #195)"
  - bugfix: "Дроны, обезьяны и дедчат-спешлы теперь используют fast_fire для стрельбы. (PR #195)"
  - bugfix: "Исправлены проверки на удалённые объекты у глаз ИИ и HUD. (PR #195)"