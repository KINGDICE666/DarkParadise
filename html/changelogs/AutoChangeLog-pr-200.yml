changes:
  - admin: "В Edit Filters добавлены пресеты эффектов, анимация параметров фильтров, копирование/вставка и удаление всех фильтров. (PR #200)"
  - admin: "В Edit Particles добавлены новые готовые частицы, копирование/вставка и создание шлейфа из частиц. (PR #200)"
  - admin: "Добавлен пункт VV «Add/Remove Trail» — шлейф из послеобразов или частиц за объектом. (PR #200)"
  - bugfix: "Исправлены рантайм при переименовании фильтра, падение массового применения фильтров и падение интерфейса редактора частиц на некоторых пресетах. (PR #200)"