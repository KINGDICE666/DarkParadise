author: "KINGDICE666"
delete-after: True
changes:
  - add: "Добавлен новый лобби-интерфейс для новых игроков с кнопками настройки персонажа, готовности, присоединения и наблюдения. (PR #135)"
  - add: "Добавлена модульная система предпочтений с разделами для персонажа, игры и привязок клавиш, реализованная через TGUI. (PR #135)"
  - add: "Заменён статический HTML-заставка на динамическую систему изображений и случайных фраз в лобби. (PR #135)"
  - add: "Увеличена длина поля реального имени в базе данных до 50 символов и поля TTS‑seed до 64 символов. (PR #135)"
  - add: "Добавлен колонка preferences в таблицы characters и player для хранения дополнительных настроек. (PR #135)"
  - add: "Изменено значение по умолчанию для viewrange на «19x15» (ультраширокий режим). (PR #135)"
  - add: "Добавлены новые графические ресурсы лобби (фон, кнопки, иконки, шторки, подсказки) и звуковые эффекты выбора пункта меню. (PR #135)"
  - add: "Добавлен новый экран лобби с анимированной шторкой и интерактивными нижними кнопками. (PR #135)"
  - add: "Добавлена возможность открывать меню предпочтений персонажа через кнопку «Настроить персонажа» в лобби. (PR #135)"
  - add: "Добавлен индикатор готовности игрока, который переключается между готовым и не готовым состоянием. (PR #135)"
  - add: "Добавлена кнопка «Присоединиться к игре», которая становится активной после завершения предварительного этапа раунда. (PR #135)"
  - add: "Добавлена кнопка «Наблюдать», позволяющая перейти в режим наблюдения после старта раунда. (PR #135)"
  - add: "Добавлен файл строк lobby_phrases.txt для отображения случайных фраз в заголовке лобби. (PR #135)"
  - add: "Добавлен тестовый модуль test_preferences.dm для проверки работы новой системы предпочтений. (PR #135)"
  - tweak: "Перенесён доступ к предпочтениям с прямого свойства на вызов метода read_preference во множестве мест кода. (PR #135)"
  - del: "Удалён старый файл preferences_tgui.dm и связанные с ним файлы предпочтений (loadout_tgui.dm, preferences_jobs.dm). (PR #135)"
  - del: "Удалён HTML‑файл title_screen.html и связанные логотипы. (PR #135)"
  - del: "Удалён старый подсистемный код titlescreen.dm, заменённый новой реализацией. (PR #135)"
  - code_imp: "Добавлены новые определения слоёв лобби и флагов эксклюзивных профессий. (PR #135)"
  - config: "Обновлён SQL_VERSION до 44 и добавлен миграционный скрипт 43-44.sql. (PR #135)"