author: "KINGDICE666"
delete-after: True
changes:
  - add: "Добавлен биопринтер органов: перерабатывает сырое мясо в биомассу и печатает расовые органы (кроме мозга и имплантов). (PR #179)"
  - balance: "Биопечатные органы имеют половину обычной прочности, не принимаются по заказам карго и три минуты приживаются после пересадки, расходуя питание пациента и повреждаясь при голодании. (PR #179)"
  - add: "Биопринтер доступен в медицинском карго за 150 кредитов и можно исследовать в R&D (programming 3, biotech 3, materials 3). (PR #179)"
  - qol: "Биопринтер получил современный TGUI-интерфейс с выбором вида, индикатором биомассы и прогрессом печати. (PR #179)"
  - bugfix: "Напечатанные органы дионы больше не превращаются в нимфы при извлечении. (PR #179)"
  - qol: "При прерванной печати биопринтер можно обслужить: открыть панель отвёрткой, починить сваркой или разобрать ломом. (PR #179)"
  - tweak: "Стоимость печати сердца увеличена до 30 единиц биомассы (остальные органы — 20). (PR #179)"