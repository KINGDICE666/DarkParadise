author: "KINGDICE666"
delete-after: True
changes:
  - add: "В игру добавлена новая раса — Резоми, с собственным языком, эмоциями и внешним видом. (PR #96)"
  - add: "Добавлена механика «Маленький персонаж», позволяющая резоми прятаться в контейнерах, проситься на руки и прыгать на спины других игроков. (PR #96)"
  - add: "Добавлены новые звуковые эффекты и эмоции для расы резоми, включая чириканье, трель и щелчков клювом. (PR #96)"
  - add: "Добавлены новые взаимодействия между игроками, такие как «Попроситься на руки» и «Запрыгнуть на спину». (PR #96)"
  - qol: "Улучшена система адаптивных спрайтов, что позволило более точно подгонять одежду под форму тела различных рас. (PR #96)"
  - add: "Добавлены новые иконки и анимации для расы резоми, включая аксессуары и маски. (PR #96)"
  - add: "Раса резоми теперь поддерживается в системе анализа здоровья и настройках внешнего вида. (PR #96)"
  - tweak: "Особенности захвата и посадки адаптированы для маленьких персонажей, чтобы учитывать их размер и особенности тела. (PR #96)"
  - add: "Добавлены новые тесты для проверки корректности работы системы фиттинга и расы резоми. (PR #96)"