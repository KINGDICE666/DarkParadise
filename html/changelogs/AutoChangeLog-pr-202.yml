author: "AndreeykasTea"
delete-after: True
changes:
  - local: "Ядерный реактор, стержни, камеры, центрифуга и интерфейс монитора переведены на русский язык. (PR #202)"
  - add: "В реактор добавлены новые газообразные хладагенты и модераторы с уникальными эффектами на тепло, реактивность и стабильность. (PR #202)"
  - add: "Введена система аварийной остановки реактора (SCRAM) с отсрочкой перезапуска и отслеживанием истории параметров. (PR #202)"
  - tweak: "Ядерные стержни теперь имеют классы (топливо, замедлитель, охладитель) и уровни прочности, влияющие на работу камер. (PR #202)"
  - qol: "Интерфейс монитора реактора отображает состояние камер, стержней, газов и историю работы в реальном времени. (PR #202)"
  - local: "Сообщения взаимодействия с узлами газообмена, центрифугой и фабрикатором стержней переведены на русский. (PR #202)"