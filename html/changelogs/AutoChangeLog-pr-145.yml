author: "KINGDICE666"
delete-after: True
changes:
  - bugfix: "Исправлены проверки размера при раздевании мобов через новый proc too_small_to_strip. (PR #145)"
  - add: "Коробки с доnk‑покетами теперь принимают только указанные варианты закусок (donkpocket, warmdonkpocket и т.д.). (PR #145)"
  - qol: "Предмет tk_grab больше не считается громоздким и может помещаться в инвентарь. (PR #145)"
  - qol: "При шепоте из внутри держателя (например, коробки) используется позиция на turf. (PR #145)"
  - tweak: "Отображение мутаций подложек теперь использует fitted appearance для корректного масштабирования у не‑обезьяньих рас. (PR #145)"
  - add: "В health analyzer добавлена локализация хвоста резоми и fallback на оригинальное имя, если перевод отсутствует. (PR #145)"