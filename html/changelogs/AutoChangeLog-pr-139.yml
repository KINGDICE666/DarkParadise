author: "KINGDICE666"
delete-after: True
changes:
  - qol: "Улучшена функция экипировки: теперь карты, наличные и монеты сначала пытаются поместиться в кошелёк. (PR #139)"
  - add: "Добавлена поддержка языка резоми для ИИ, переводчика PAI, модулей роботов и простых животных-ботов. (PR #139)"
  - balance: "Увеличено ночное зрение глаз резоми с 5 до 6 тайлов. (PR #139)"
  - tweak: "Изменён механика паутины терро-пауков: теперь срабатывает через сигнал при входе и применяет ослабление и замедление. (PR #139)"
  - tweak: "Изменено дефиле стен revenant: эффект ржавчины применяется только к стенам без trait rusty и добавляет элемент ржавчины вместо смены turf. (PR #139)"
  - tweak: "Добавлена проверка кастомных требований при отображении доступных профессий для новых игроков. (PR #139)"
  - spellcheck: "Обновлены комментарии и тесты резоми под новые значения зрения. (PR #139)"