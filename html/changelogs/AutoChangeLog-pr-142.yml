author: "KINGDICE666"
delete-after: True
changes:
  - add: "Добавлены новые типы транзитных труб (прямая, перекрёстная, изогнутая, диагональная, диагональная с перекрёстком, junction, станция, терминал, диспенсер‑станция, диспенсер‑терминал и капсула), доступные через раздатчик труб и RPD. (PR #142)"
  - add: "Добавлен TGUI‑интерфейс раздатчика труб с вкладками по категориям труб. (PR #142)"
  - add: "Добавлен новый режим RPD «Transit» для размещения и удаления транзитных труб. (PR #142)"
  - add: "Добавлено взаимодействие гаечным ключом с транзитными трубами для их крепления/открепления от пола. (PR #142)"
  - qol: "Увеличен таймаут хранения в iframe‑storage с 5 до 15 секунд, уменьшив вероятность ложных таймаутов. (PR #142)"
  - sound: "Добавлен звуковой эффект переключения инструмента при смене режима RPD. (PR #142)"
  - tweak: "Обновлён раздатчик утилизационных труб, чтобы он принимал транзитные трубы и капсулы для утилизации. (PR #142)"
  - tweak: "Обновлён обработчик turf, чтобы RPD мог создавать транзитные трубы в режиме Transit. (PR #142)"