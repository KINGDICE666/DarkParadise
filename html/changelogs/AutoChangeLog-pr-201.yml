author: "AndreeykasTea"
delete-after: True
changes:
  - add: "Пушка хронолегионера теперь заряжается, пока зажата кнопка мыши: полностью заряженный выстрел стирает цель из реальности, ломает пол, повреждает объекты вокруг и стирает стены, не разгерметизируя станцию. (PR #201)"
  - add: "Неполный заряд пушки хронолегионера выпускает слабый выстрел, который оглушает цель и заключает её в хронополе. (PR #201)"
  - add: "У хронокостюма появились временной щит, отклоняющий снаряды в случайные стороны, и рывок: скачок в пространстве сквозь стены со шлейфом, отбрасывающий всё вокруг места приземления. (PR #201)"
  - add: "У хронолегионера появились цели, хронопанель с миссией и возможность покинуть реальность после выполнения целей. (PR #201)"
  - balance: "Хронокостюм получил более высокие резисты и быстрее уходит в хронополёт. (PR #201)"
  - bugfix: "ЭМИ или снятие хронокостюма во время фазирования больше не удаляют носителя, а снятый костюм больше не оставляет персонажа обездвиженным. (PR #201)"
  - bugfix: "Удаление поля стирания больше не удаляет пойманного в него моба. (PR #201)"
  - bugfix: "Камера хронополёта больше не возвращается к легионеру во время фазирования. (PR #201)"
  - bugfix: "Энергопушки с бесплатным выстрелом (T.E.D., сюрикен-эмиттер, сфера Ратвара) снова стреляют без ошибки деления на ноль. (PR #201)"
  - admin: "В Secrets добавлена кнопка отправки хронолегионера на станцию с выбором места, миссии и цели. (PR #201)"
  - sound: "Пушка, костюм и рюкзак хронолегионера получили звуки зарядки, выстрела, стирания, рывка, щита и хронополёта. (PR #201)"
  - refactor: "Код снаряжения хронолегионера переписан на таймеры, сигналы и статус-эффекты. (PR #201)"