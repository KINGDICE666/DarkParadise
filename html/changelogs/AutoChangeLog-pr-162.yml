author: "KINGDICE666"
delete-after: True
changes:
  - add: "Добавлены клоуны-оперативники — новый тип ядерных оперативников с уникальной бомбой, снаряжением и механиками. (PR #162)"
  - add: "Добавлена бананиевая боеголовка: при взрыве превращает всех людей на станции в клоунов с неуклюжестью и фобией клоунов. (PR #162)"
  - add: "Добавлено уникальное снаряжение клоун-оперативников: боевые ботинки с банановой кожурой, пирогомёт, пиньята, тактический парик-маска. (PR #162)"
  - add: "Добавлены электронные бойки для оружия, ограничивающие использование клоунами и неуклюжими (вариант с самоуничтожением). (PR #162)"
  - add: "Добавлена система индукции: био-чип для вербовки членов экипажа в клоун-оперативников без промывания мозгов. (PR #162)"
  - add: "Добавлен имплант тактической карты с отображением союзников, бомб, диска и мехов; лидер может рисовать маршруты. (PR #162)"
  - add: "Добавлены маяки подкрепления: клоун-оперативник и обезьяна-агент с уникальным снаряжением и ящиком с замком по лапе. (PR #162)"
  - add: "Добавлен боевой мёх Dark H.O.N.K. с мортиром бомбанан и запускателем слезоточивых усов. (PR #162)"
  - add: "Добавлен отдельный тип аплинка для клоун-оперативников с общим пулом предметов и уникальными закупками. (PR #162)"
  - admin: "Админы могут создавать отряд клоунов-оперативников через One-Click Antag и админ-панель. (PR #162)"
  - add: "Добавлен трейт NAIVE (наивность) для механик клоун-оперативников. (PR #162)"
  - add: "Добавлена супер-смазка (TURF_WET_SUPERLUBE) — удлиненное скольжение с игнорированием защиты от скольжения. (PR #162)"
  - code_imp: "Компонент slippery теперь поддерживает принудительный сброс предметов и срабатывание при получении урона/броске. (PR #162)"