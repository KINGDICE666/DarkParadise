author: "KINGDICE666"
delete-after: True
changes:
  - add: "Добавлена система гражданских баунти с терминалом управления, платформой отправки и кубами наград. (PR #206)"
  - add: "Добавлены личные и отдела заказы через терминал карго и приложение PDA с привязкой к банковскому счёту. (PR #206)"
  - tweak: "Шаттл снабжения теперь начисляет кредиты за возвращённые слипы, ящики и интел вместо очков поставки. (PR #206)"
  - tweak: "Станционные и дополнительные цели платят кредитами на счёт отдела снабжения вместо очков карго. (PR #206)"
  - add: "Добавлены шкафы и кейсы, привязанные к банковскому счёту покупателя и открываемые только его владельцу. (PR #206)"
  - add: "Добавлены голодиагностики мехов с уникальными данными о сборке. (PR #206)"
  - add: "Центральное командование сообщает о товарах с повышенным спросом и утроенной выплатой за их поставку. (PR #206)"
  - add: "Добавлены новые типы гражданских баунти для различных профессий. (PR #206)"
  - local: "Добавлены переводы названий отделов станции на русский язык. (PR #206)"