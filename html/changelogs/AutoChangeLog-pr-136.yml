author: "KINGDICE666"
delete-after: True
changes:
  - add: "Добавлен новый антагонист-свармер с уникальными структурами, действиями и классами. (PR #136)"
  - add: "Введены три новых типа лазерного оружия (аккумуляторный, автоматический и хитаскан) с соответствующими патронами и звуками выстрелов. (PR #136)"
  - add: "Добавлен модуль боевых искусств «Сила», включающий приём силой толчок и связанные звуковые эффекты. (PR #136)"
  - add: "Добавлен интерфейс превью персонажа и панель модификаторов для кастомного костюма. (PR #136)"
  - add: "Добавлен набор новых звуков: выстрелы лазерного оружия, звуки работы свармера (анализатор, процессор, телепорт), дрель, щелчок ручки, силовое удушение и zipline. (PR #136)"
  - add: "Добавлены новые иконки для свармера, лазерного оружия и интерфейса HUD. (PR #136)"
  - map: "Обновлены карты Delta, Cyberiad, De Kerberos 2 и другие локации (исправления и синхронизация). (PR #136)"
  - tweak: "Исправлены отступы и форматирование в руководстве по локализации. (PR #136)"
  - qol: "Улучшена панель кастомного костюма: добавлены быстрый доступ к слотам рюкзака и пояса. (PR #136)"
  - admin: "Добавлен новый сигнал уничтожения ядра свармера для администраторских скриптов. (PR #136)"