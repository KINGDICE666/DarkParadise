author: "KINGDICE666"
delete-after: True
changes:
  - add: "Добавлено визуальное меню выбора языков и речевых режимов в интерфейсе игрока. (PR #161)"
  - add: "Введены новые персонажные черты, связанные с расовыми языками, телепатией и коллективными разумами. (PR #161)"
  - bugfix: "Корректно отработали обновлённые механизмы мозговых травм, таких как афазия, гипноз и раздвоение личности. (PR #161)"
  - qol: "Упрощена логика понимания и перевода языков при смене тела, клонировании или влиянии на разум. (PR #161)"
  - add: "Добавлена возможность блокировать понимание определённых языков, например, при заражении лихорадкой Вавилона. (PR #161)"
  - refactor: "Система языков и речи полностью переписана с использованием объектных классов для улучшения масштабируемости. (PR #161)"