author: "KINGDICE666"
delete-after: True
changes:
  - tweak: "Гостевые ключи больше не могут использовать кнопку ссылки на Discord и глагол fitviewport, если не заходят через лаунчер. (PR #172)"
  - server: "Веб-клиент теперь ставит в очередь темы, превышающие лимит в 8 сообщений в секунду. (PR #172)"
  - add: "В веб-клиенте добавлена поддержка макросов с позицией мыши и размером карты. (PR #172)"
  - tweak: "Веб-клиент переводит ключевые слова краёв экрана BYOND 515 в компасные направления. (PR #172)"
  - image: "Maptext в веб-клиенте использует стили карты и корректно обрабатывает прозрачные цвета. (PR #172)"
  - qol: "Команды темы, шрифта и стиля вкладок панели статистики применяются напрямую в браузере. (PR #172)"