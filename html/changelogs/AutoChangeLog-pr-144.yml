changes:
  - add: "Добавлен статус-эффект Прислушивание для резоми, позволяющий слышать звуки через стены и отмечать их сонаром. (PR #144)"
  - add: "Добавлен орган действия Прислушаться для ушей резоми, активирующий статус-эффект Прислушивание. (PR #144)"
  - add: "При ношении ушей резоми теперь также выдаётся черта Слабые уши. (PR #144)"
  - tweak: "Крик вокса теперь оглушает существа с хорошим слухом в радиусе 3 клеток на 10 секунд. (PR #144)"
  - qol: "Добавлена тактильная версия overlay слепоты для игроков с trait feeling_around (ощупывание). (PR #144)"
  - qol: "Эхолокация получила выбираемый фокус и локализована на русский язык. (PR #144)"
  - tweak: "При наличии trait feeling_around освещение становится полной яркостью. (PR #144)"
  - add: "Добавлен юнит‑тест для проверки механики слуха резоми. (PR #144)"